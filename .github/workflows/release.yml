name: release

# A `v*` tag builds one archive per platform and attaches them to a GitHub
# release, named so `mise use github:brandonocasey/agent-review` finds them.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked

  build:
    needs: test
    strategy:
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package
        run: |
          name=agent-review-${{ github.ref_name }}-${{ matrix.target }}
          cp dist/target/${{ matrix.target }}/release/agent-review .
          tar -czf "$name.tar.gz" agent-review
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: agent-review-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}" agent-review-*.tar.gz
          --repo "${{ github.repository }}" --title "${{ github.ref_name }}"
          --generate-notes
