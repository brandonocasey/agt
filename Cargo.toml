[package]
name = "agt"
version = "0.12.0"
edition = "2024"
rust-version = "1.95"
description = "Command-line tools for coding agents"
publish = false
autotests = false

[[test]]
name = "integration"
path = "test/integration/main.rs"

[dependencies]
base64 = "0.22.1"
clap = { version = "4.5.51", features = ["derive"] }
indexmap = { version = "2.9.0", features = ["serde"] }
libc = "0.2.186"
regex = "1.13.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order", "float_roundtrip"] }
sha1_smol = "1.0.1"
sha2 = "0.10.9"
tempfile = "3.23.0"
thiserror = "2.0.17"
toml = "1.1.8"

[dev-dependencies]
assert_cmd = "2.1.1"
assert_fs = "1.1.3"

# Lint policy lives in the manifest so a bare `cargo clippy` and rust-analyzer
# enforce what `mise run clippy` does; the task adds `-D warnings`.
[lints.clippy]
all = { level = "warn", priority = -1 }
cognitive_complexity = "warn"

[profile.release]
lto = "fat"
strip = true
opt-level = 3
panic = "abort"
codegen-units = 16
