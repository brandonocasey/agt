[package]
name = "agent-review"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
description = "Local PR/MR-style review threads for coding agents"
publish = false
autotests = false

[[test]]
name = "integration"
path = "test/integration/main.rs"

[dependencies]
clap = { version = "4.5.51", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha1_smol = "1.0.1"
tempfile = "3.23.0"
thiserror = "2.0.17"

[dev-dependencies]
assert_cmd = "2.1.1"
assert_fs = "1.1.3"

# Lint policy lives in the manifest so a bare `cargo clippy` and rust-analyzer
# enforce what `mise run clippy` does; the task adds `-D warnings`.
[lints.clippy]
all = { level = "warn", priority = -1 }
cognitive_complexity = "warn"

[profile.release]
lto = "fat"
strip = true
opt-level = 3
panic = "abort"
codegen-units = 16
